    name: Current Step
```

## Time window defaults

This package is configured for:
- Start: 10:05
- End: 15:55

The charger will only operate when the current time is within this range and solar production meets the configured thresholds. If `input_boolean.pv_charge_safety_override` is switched on, the PV automation will simply stay idle and allow other scripts or manual control to work unimpeded.

At the moment the charging window closes, the `Stop charger at window end` automation tries to issue the charger-specific stop command. Replace the placeholder `switch.ev_charger_stop_charging` with the entity/service used by your charger model. If no dedicated stop command is available, set current to 0 A as the fallback.

---

This configuration gives you a practical time-windowed PV charging setup for Home Assistant with the updated threshold mapping, a non-invasive safety override, and a generic stop command at the end of the active window.

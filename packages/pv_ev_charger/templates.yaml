template:
  - sensor:
      - name: PV Solar Power
        unique_id: pv_solar_power
        unit_of_measurement: W
        state: >-
          {% set ent = states('input_text.pv_solar_power_sensor') %}
          {% if ent in ['unknown', 'unavailable', ''] %}
            unknown
          {% else %}
            {{ states(ent) | float(0) }}
          {% endif %}

      # Target current is ALWAYS clamped to 6-15 A. It never returns 0.
      # Below the step 1 threshold the target is the 6 A minimum.
      - name: PV Target Charge Current
        unique_id: pv_target_charge_current
        unit_of_measurement: A
        state: >-
          {% set solar = states('sensor.pv_solar_power') | float(0) %}
          {% set t1 = states('input_number.pv_step_1_threshold') | float(0) %}
          {% set t2 = states('input_number.pv_step_2_threshold') | float(0) %}
          {% set t3 = states('input_number.pv_step_3_threshold') | float(0) %}
          {% set t4 = states('input_number.pv_step_4_threshold') | float(0) %}
          {% if solar >= t4 %}
            {% set raw = states('input_number.pv_step_4_current') | float(15) %}
          {% elif solar >= t3 %}
            {% set raw = states('input_number.pv_step_3_current') | float(10) %}
          {% elif solar >= t2 %}
            {% set raw = states('input_number.pv_step_2_current') | float(8) %}
          {% elif solar >= t1 %}
            {% set raw = states('input_number.pv_step_1_current') | float(6) %}
          {% else %}
            {% set raw = 6 %}
          {% endif %}
          {{ [6, [raw, 15] | min] | max }}

  - binary_sensor:
      - name: PV Charge Window Active
        unique_id: pv_charge_window_active
        state: >-
          {% set start = states('input_datetime.pv_charge_window_start') %}
          {% set end = states('input_datetime.pv_charge_window_end') %}
          {% set now_t = now().strftime('%H:%M:%S') %}
          {% if start in ['unknown', 'unavailable', 'none', ''] or end in ['unknown', 'unavailable', 'none', ''] %}
            {{ false }}
          {% elif start <= end %}
            {{ start <= now_t and now_t < end }}
          {% else %}
            {{ now_t >= start or now_t < end }}
          {% endif %}

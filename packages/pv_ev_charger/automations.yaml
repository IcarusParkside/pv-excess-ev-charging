automation:
  - alias: PV EV Charger - Update Current Step
    id: pv_ev_charger_update_current_step
    description: >-
      Step the charger current up/down using 6, 8, 10, 13 and 15 A with
      hysteresis, only while the charge window is active. Outside the window
      this automation does nothing, so the charger is released for manual use.
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - sensor.pv_target_charge_current
          - binary_sensor.pv_charge_window_active
          - input_number.pv_step_1_current
          - input_number.pv_step_2_current
          - input_number.pv_step_3_current
          - input_number.pv_step_4_current
          - input_number.pv_step_5_current
          - input_number.pv_step_1_threshold
          - input_number.pv_step_2_threshold
          - input_number.pv_step_3_threshold
          - input_number.pv_step_4_threshold
          - input_number.pv_step_up_delay_minutes
          - input_number.pv_step_down_delay_minutes
          - input_text.pv_ev_connected_sensor
          - input_boolean.pv_charge_safety_override
    condition:
      - condition: state
        entity_id: input_boolean.pv_charge_safety_override
        state: "off"
      - condition: state
        entity_id: binary_sensor.pv_charge_window_active
        state: "on"
      - condition: template
        value_template: >-
          {% set ev_entity = states('input_text.pv_ev_connected_sensor') %}
          {{ ev_entity not in ['unknown', 'unavailable', ''] and states(ev_entity) == 'on' }}
    action:
      - variables:
          target_current: "{{ states('sensor.pv_target_charge_current') | float(6) }}"
          charger_entity: "{{ states('input_text.pv_charger_current_entity') }}"
          current_current: "{{ states(charger_entity) | float(0) }}"
          last_change_raw: "{{ states('input_datetime.pv_last_step_change') }}"
          last_change_ts: >-
            {% if last_change_raw in ['unknown', 'unavailable', ''] %}
              0
            {% else %}
              {{ as_timestamp(last_change_raw) }}
            {% endif %}
          minutes_since_change: >-
            {% if last_change_ts | float(0) == 0 %}
              9999
            {% else %}
              {{ ((as_timestamp(now()) - (last_change_ts | float(0))) / 60) }}
            {% endif %}
          up_delay: "{{ states('input_number.pv_step_up_delay_minutes') | float(3) }}"
          down_delay: "{{ states('input_number.pv_step_down_delay_minutes') | float(2) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ target_current | float(0) > current_current | float(0)
                     and minutes_since_change | float(0) >= up_delay | float(0) }}
            sequence:
              - service: number.set_value
                target:
                  entity_id: "{{ charger_entity }}"
                data:
                  value: "{{ target_current | float(6) }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.pv_current_step
                data:
                  value: "step_{{ target_current | float(6) | int }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.pv_last_step_change
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{ target_current | float(0) < current_current | float(0)
                     and minutes_since_change | float(0) >= down_delay | float(0) }}
            sequence:
              - service: number.set_value
                target:
                  entity_id: "{{ charger_entity }}"
                data:
                  value: "{{ target_current | float(6) }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.pv_current_step
                data:
                  value: "step_{{ target_current | float(6) | int }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.pv_last_step_change
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
